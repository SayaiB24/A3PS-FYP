# a3ps default pipeline configuration
model_name: yolov8s-seg.pt
tracker: configs/botsort_a3ps.yaml   # track_buffer 90 (was 30) -- see file comment
classes:
  - person
  - bicycle
  - car
  - motorcycle
  - bus
  - truck
conf: 0.35
img_size: 1280
process_fps: 30
predict_hz: 5
horizon_s: 4.0
history_s: 2.0
base_threshold: 0.75
caution_threshold: 0.4
# Decision state machine (see a3ps/risk/decision.py).
alert_margin: 0.15        # ALERT fires at (active_threshold - this)
frames_to_confirm: 3      # consecutive frames a prob must hold to advance a state
event_cooldown_s: 2.0     # per-actor re-arm cooldown after an event
threshold_floor: 0.45     # active_threshold never drops below this
risk_ema_alpha: 0.4       # cross-frame EMA on each track's collision prob
mask_poly_max_points: 40

# Actor collision radius by class, used to dilate the ego corridor when
# integrating collision probability (Minkowski sum with a disk). BEV values are
# physical metres; the pixel values are rough stand-ins used while forecasting
# in image space (forecast_space="img", no ground plane yet).
actor_radius_m:
  person: 0.4
  bicycle: 0.5
  motorcycle: 0.6
  car: 1.0
  bus: 1.5
  truck: 1.5
actor_radius_px:
  person: 8
  bicycle: 10
  motorcycle: 12
  car: 20
  bus: 28
  truck: 28

# Ego corridor: a fixed trapezoid over the lower-center of the frame, given as
# fractions of frame width (x) and height (y). Order: bottom-left, bottom-right,
# top-right, top-left.
ego_corridor:
  bottom_y_frac: 1.00
  top_y_frac: 0.60
  bottom_left_frac: 0.39
  bottom_right_frac: 0.61
  top_left_frac: 0.48
  top_right_frac: 0.52

# Forecast in bird's-eye-view metres ("bev") or image pixels ("img").
# Default "img" until the ground plane is calibrated per clip (Week 4 demo
# clips get a ground_plane_override). BEV code path stays fully supported.
forecast_space: img

# Ground-plane calibration: 4 image points (fractions of width/height) mapped
# to ground coordinates in metres. Order: bottom-left, bottom-right, top-right,
# top-left. Lane 3.6 m wide (x in [-1.8, 1.8]) at 0 m and 25 m ahead.
# Tweak per clip via an override file (JSON/YAML) named in ground_plane_override.
ground_plane:
  image_points_frac:
    - [0.30, 1.00]
    - [0.70, 1.00]
    - [0.55, 0.62]
    - [0.45, 0.62]
  ground_points_m:
    - [-1.8, 0.0]
    - [1.8, 0.0]
    - [1.8, 25.0]
    - [-1.8, 25.0]
# ground_plane_override: null   # e.g. dashboard/clips/<clip>/ground.yaml
